services:
  - type: web
    name: aiready-checker
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        sync: false
      - key: APP_BASE_URL
        value: https://aiready-checker.onrender.com
      - key: PAYPAL_HOSTED_BUTTON_ID
        value: VA8TFCR6A8NMY
      - key: PAYPAL_RECEIVER_EMAIL
        sync: false
      - key: REPORT_FROM_EMAIL
        sync: false
      - key: USD_PRICE
        value: "9"
