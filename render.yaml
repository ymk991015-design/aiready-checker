services:
  - type: web
    name: aiready-checker
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        sync: false
      - key: APP_BASE_URL
        value: https://aiready-checker.onrender.com
      - key: PAYPAL_URL
        value: https://www.paypal.com/paypalme/MingkunYang/9
      - key: USD_PRICE
        value: "9"
